name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight; there is no value in finishing a
# check on a commit nobody will look at again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # The same image the references were generated in, and the reason this job
    # can compare screenshots at zero pixel tolerance at all: text rendering
    # depends on the system's fonts, so the environment has to be pinned. Run
    # `npm run test:e2e` locally and it uses this exact image through Docker.
    #
    # --ipc=host: Chromium runs out of shared memory with a container's default
    # /dev/shm and dies mid-test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Called directly rather than through `npm run test:e2e`: that script
      # starts this same image with Docker, and we are already inside it.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The Worker follows every push to main that passed both checks. Without
  # this job a change under src/sim/ rebuilt the client with a new core
  # digest while the Worker kept the old one, and every ranked run got a 409
  # after a full run — 12 September 2026. No path filter: the deploy is
  # idempotent and the digest is what matters. The job skips itself, green,
  # until the two repository secrets exist; they are the author's to set.
  deploy-server:
    name: Deploy the Worker
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npm run server:deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: echo "CLOUDFLARE_API_TOKEN is not set — the Worker was not deployed. See .env.example."
        if: env.CLOUDFLARE_API_TOKEN == ''
