<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>G-SURGE</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  /* Explicit size, not just position:fixed. A replaced element keeps its
     intrinsic 300x150 otherwise, and at devicePixelRatio 2 you see the top
     left quarter of the frame. See CLAUDE.md, first trap. */
  canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  /* Above the canvas: the renderer appends it to the body after this, and
     two positioned siblings stack in document order. */
  .preview { position: fixed; z-index: 1; left: 50%; bottom: 14px; transform: translateX(-50%);
    margin: 0; padding: 7px 14px; border-radius: 999px; font: 500 12px/1
    system-ui, sans-serif; letter-spacing: .04em; color: #7fd8ee;
    background: rgba(8, 20, 28, .55); border: 1px solid rgba(37, 226, 255, .3);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
</style>
</head>
