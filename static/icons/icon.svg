<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>G-SURGE</title>
  <!--
    Source of truth for the icons. The PNGs beside it are generated by
    `npm run icons`, which rasterises this file; edit here, never there.

    The mark is the game's own silhouette rather than a letter: a track
    receding to a vanishing point, its neon lips converging, under a gantry.
    It is what the first frame of a run looks like, and it stays legible at
    the 48 pixels a browser tab actually gives it — which a wordmark would
    not.

    Everything sits inside a circle of radius 205 about the centre, the
    maskable safe zone, so the same drawing serves both purposes.
  -->
  <defs>
    <linearGradient id="lip" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#25e2ff"/>
      <stop offset="1" stop-color="#0b4a63"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2b3646"/>
      <stop offset="1" stop-color="#151d29"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#05060a"/>

  <!-- The drawing is laid out around y=320 because that is where the geometry
       reads naturally; this recentres it on the tile and fills it. Its far
       corners then sit at radius 254, outside the maskable safe zone of 205 —
       which is exactly what the 0.78 scale in the rasteriser is for. -->
  <g transform="translate(256 256) scale(1.32) translate(-256 -320)">

  <!-- the road, narrowing to the vanishing point -->
  <path d="M 118 428 L 394 428 L 268 236 L 244 236 Z" fill="url(#road)"/>

  <!-- chevrons, spaced so they read as motion rather than as texture -->
  <g fill="#8fa3bb" opacity="0.55">
    <path d="M 150 414 L 256 386 L 362 414 L 256 396 Z"/>
    <path d="M 178 372 L 256 350 L 334 372 L 256 358 Z"/>
    <path d="M 200 330 L 256 314 L 312 330 L 256 320 Z"/>
  </g>

  <!-- neon lips, wider near the eye and vanishing with the road -->
  <path d="M 96 428 L 124 428 L 246 236 L 238 236 Z" fill="url(#lip)"/>
  <path d="M 416 428 L 388 428 L 266 236 L 274 236 Z" fill="url(#lip)"/>

  <!-- gantry: the hot bar that marks every twelfth segment -->
  <g fill="#ff2f9a">
    <rect x="196" y="212" width="120" height="13" rx="6"/>
    <rect x="192" y="212" width="9" height="34" opacity="0.75"/>
    <rect x="311" y="212" width="9" height="34" opacity="0.75"/>
  </g>

  <!-- the ship, a single wedge, enough to say what the road is for -->
  <path d="M 256 300 L 288 330 L 256 322 L 224 330 Z" fill="#dff0ff"/>
  <circle cx="240" cy="330" r="5" fill="#8af4ff"/>
  <circle cx="272" cy="330" r="5" fill="#8af4ff"/>

  </g>
</svg>
