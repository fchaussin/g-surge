# Sous Docker rootless — le cas ici — l'uid 0 du conteneur est déjà l'utilisateur
# de l'hôte : c'est la valeur qui donne des fichiers montés lisibles et écrits
# au bon propriétaire. Sur un démon classique (rootful), lancer plutôt avec
#   GSURGE_USER="$(id -u):$(id -g)" docker compose up
# sinon dist/ sort en root.

name: g-surge

services:
  # Serveur de développement Vite, sur http://localhost:5173
  # Les sources sont montées, pas copiées : une édition sur l'hôte est reprise
  # à chaud, il n'y a rien à reconstruire.
  dev:
    build: .
    image: g-surge-dev
    init: true
    user: '${GSURGE_USER:-0:0}'
    ports:
      - '${GSURGE_PORT:-5173}:5173'
    volumes:
      - .:/app
    healthcheck:
      # node et non wget : node:24-slim n'embarque pas wget, et le contrôle
      # échouait donc en silence — conteneur marqué unhealthy alors que le
      # serveur répondait très bien.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Commandes ponctuelles dans la même image, sans démarrer de serveur :
  #   docker compose run --rm tools npm run verify
  #   docker compose run --rm tools npm run build
  # Playwright n'y est pas : l'image ne porte pas de navigateur.
  # Le profil l'exclut de « docker compose up ».
  # Suite de bout en bout, dans l'image officielle Playwright.
  #
  # C'est l'environnement de référence, et pas un confort : les captures
  # d'interface sont comparées au pixel près, or le rendu du texte dépend des
  # polices du système. Les références sont donc engendrées ici et vérifiées
  # ici, y compris par l'intégration continue, qui utilise la même image.
  #
  # ipc: host — Chromium manque de mémoire partagée avec le /dev/shm par défaut
  # d'un conteneur et se ferme en plein test.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ['tools']
    init: true
    ipc: host
    user: '${GSURGE_USER:-0:0}'
    working_dir: /app
    volumes:
      - .:/app
    command: ['npx', 'playwright', 'test']

  tools:
    build: .
    image: g-surge-dev
    profiles: ['tools']
    user: '${GSURGE_USER:-0:0}'
    volumes:
      - .:/app
    # Pris dans .env s'il existe, jamais dans l'image : un jeton Cloudflare
    # pour `wrangler d1 create` et `server:deploy*`, absent en dehors de ces
    # commandes.
    environment:
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_ACCOUNT_ID
    command: ['npm', 'run', 'verify']
